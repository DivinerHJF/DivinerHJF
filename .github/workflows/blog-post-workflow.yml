name: Latest blog post workflow

on:
  schedule: # Run workflow automatically
    - cron: '0 0 * * *' # Runs once a day at 00:00 UTC to avoid RSS feed rate limits
  workflow_dispatch: # Run workflow manually through the GitHub Actions Workflow page

permissions:
  contents: write # Allow the workflow to commit README updates

concurrency:
  group: latest-blog-post-workflow
  cancel-in-progress: true

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://philohao.com/index.xml"
          retry_count: 3
          retry_wait_time: 60
          user_agent: "Mozilla/5.0 (compatible; DivinerHJF latest-blog-post-workflow; +https://github.com/DivinerHJF/DivinerHJF)"
